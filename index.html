<style>
:root{
 --accent:#00d2ff;--danger:#ff3b30;--success:#34c759;--orange:#ff9f0a;
 --purple:#bf5af2;--blue:#00a8ff;--bg:#070a10;--panel:rgba(8,16,27,.88);
 --border:rgba(0,210,255,.28);--text:#fff;--sub:#7a8291;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden!important}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;user-select:none}
body.light{--bg:#eef2f6;--panel:rgba(250,252,255,.94);--border:rgba(0,100,200,.25);--text:#102238;--sub:#56677b}
#app{position:fixed;inset:0;padding:max(5px,env(safe-area-inset-top)) 6px calc(58px + env(safe-area-inset-bottom));overflow:hidden}
#dash{height:100%;width:100%;max-width:520px;margin:auto;display:grid;grid-template-rows:42px 108px minmax(250px,38vh) 1fr;gap:5px;overflow:hidden}
.card,.top,.viewer,.btn{background:linear-gradient(145deg,var(--panel),rgba(10,25,40,.75));border:1px solid var(--border);box-shadow:0 5px 18px rgba(0,0,0,.28)}
.top{border-radius:12px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between}
.brand strong{font-size:21px;color:var(--accent);font-style:italic}.brand span{font-size:11px;font-weight:700;letter-spacing:1px}
.topright{display:flex;align-items:center;gap:8px;font-size:8px;color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}.dot.on{background:var(--success)}
.theme{border:1px solid var(--border);background:transparent;color:var(--accent);border-radius:8px;width:30px;height:28px;font-size:16px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-height:0}
.card{border-radius:11px;padding:7px 8px;overflow:hidden}
.title{font-size:9px;color:var(--accent);font-weight:800;letter-spacing:1px;margin-bottom:3px}
.row{height:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(130,150,170,.14);font-size:8px;color:var(--sub)}
.row b{font-size:8.5px;color:var(--text)}.green{color:var(--success)!important}.red{color:var(--danger)!important}.orange{color:var(--orange)!important}.purple{color:var(--purple)!important}
.viewer{position:relative;border-radius:14px;overflow:hidden;min-height:0;background:radial-gradient(circle at 50% 50%,rgba(0,210,255,.14),transparent 55%),#050b12;touch-action:none}
body.light .viewer{background:radial-gradient(circle at 50% 45%,rgba(0,120,220,.10),transparent 55%),#e3eaf2}
#canvas{width:100%;height:100%;display:block}
.hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--accent);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:7px;z-index:4;white-space:nowrap;pointer-events:none}
#feedback{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:5px 9px;font-size:8px;opacity:0;transition:.2s;z-index:5;white-space:nowrap}
#feedback.show{opacity:1}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);z-index:3;font-size:9px}
.spin{width:18px;height:18px;border:2px solid rgba(0,210,255,.2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:5px;min-height:0;overflow:hidden}
.btn{border-radius:10px;color:var(--text);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:0;padding:2px;font-size:8px;touch-action:manipulation}
.btn span{font-size:17px;line-height:17px}.btn:active{transform:scale(.97)}
.wide{grid-column:span 2}.bgreen{color:var(--success)}.bred{color:var(--danger)}.borange{color:var(--orange)}.bblue{color:var(--blue)}.bpurple{color:var(--purple)}.bgray{color:#aeb5bf}
#nav{position:fixed;left:0;right:0;bottom:0;height:58px;background:rgba(4,10,16,.94);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
body.light #nav{background:rgba(245,249,253,.96)}
.nav{background:none;border:0;color:var(--sub);font-size:18px;min-width:60px}.nav small{display:block;font-size:7px;font-weight:800}.nav.active{color:var(--accent)}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:flex-end;justify-content:center;padding-bottom:10px}
#login.active{display:flex}.loginbox{width:min(280px,90vw);text-align:center}.loginbox h1{color:var(--accent);font-size:21px;font-style:italic;margin:0 0 8px}
#pin{width:150px;height:34px;background:rgba(0,0,0,.5);border:1px solid var(--accent);border-radius:8px;color:#fff;text-align:center;font-size:18px;letter-spacing:7px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}.num{height:40px;background:rgba(100,100,100,.2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px}
@media(max-height:720px){#dash{grid-template-rows:38px 96px minmax(220px,35vh) 1fr}.row{height:15px}.btn span{font-size:14px}.btn{font-size:7px}}
</style>

   <button id="btn-allclose" class="btn bgray wide" onclick="if(confirm('A je i sigurt që do të bësh Mbyllje Totale?'))sendCommand('ALL_CLOSE')"><span>🛡️</span>MBYLLJE TOTALE</button>
   <button id="btn-key" class="btn bpurple wide" onclick="toggleKey()"><span>🚫</span><label id="lbl-key-txt">ÇELËSI: JO AKTIV</label></button>

 </main>

<script>
const firebaseConfig={
 apiKey:"AIzaSyB5vAdwGuUd7oFjhxsyhuUSH84TXXSbtQo",
 authDomain:"ab592no.firebaseapp.com",
 databaseURL:"https://ab592no-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"ab592no",storageBucket:"ab592no.firebasestorage.app",
 messagingSenderId:"900777917500",appId:"1:900777917500:web:e9b29ed2d1eb2dc2c8d739"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const topicCmd="jon_i30_S3kr3t_998877/komanda";
const topicStatus="jon_i30_S3kr3t_998877/statusi";
const mqttClient=new Paho.Client("broker.hivemq.com",8884,"App_"+Math.random().toString(16).slice(2,8));
let carTimer,isMqttConnected=false,isEngineRunning=false,userRole="guest",pinEntry="";

function addPin(n){if(pinEntry.length<4){pinEntry+=n;document.getElementById("pin").value=pinEntry}}
function clearPin(){pinEntry="";document.getElementById("pin").value=""}
function checkLogin(){
 if(!pinEntry)return;
 db.ref("adminConfig/password").once("value").then(s=>{
  if(String(pinEntry)===String(s.val())){sessionStorage.setItem("isAuth","true");sessionStorage.setItem("role","admin");showApp()}
  else db.ref("guestUsers/"+pinEntry).once("value").then(g=>{
   if(g.exists()){sessionStorage.setItem("isAuth","true");sessionStorage.setItem("role","guest");showApp()}
   else{alert("PIN i gabuar ose llogaria nuk ekziston!");clearPin()}
  })
 })
}
function showApp(){document.getElementById("login").classList.remove("active");userRole=sessionStorage.getItem("role")||"guest";initMQTT()}
function logout(){sessionStorage.clear();location.reload()}
function toggleDarkMode(){document.body.classList.toggle("light");localStorage.setItem("dashTheme",document.body.classList.contains("light")?"light":"dark")}
if(localStorage.getItem("dashTheme")==="light")document.body.classList.add("light");

function showFeedback(t){const e=document.getElementById("feedback");e.textContent=t;e.classList.add("show");clearTimeout(showFeedback.t);showFeedback.t=setTimeout(()=>e.classList.remove("show"),1800)}
function toggleKey(){sendCommand(document.getElementById("val-key").innerText==="AKTIV"?"KEY_OFF":"KEY_ON")}
function sendCommand(cmd){
 if(!isMqttConnected){initMQTT();alert("Duke u rilidhur me MQTT...");return}
 try{const m=new Paho.Message(cmd);m.destinationName=topicCmd;m.qos=1;mqttClient.send(m)}catch(e){isMqttConnected=false}
}
function pingCar(manual){
 try{const m=new Paho.Message("REFRESH");m.destinationName=topicCmd;m.qos=1;mqttClient.send(m)}catch(e){}
}
function setOnline(ok){
 document.getElementById("val-online").textContent=ok?"ONLINE":"OFFLINE";
 document.getElementById("val-online").className=ok?"green":"red";
 document.getElementById("mqtt").textContent=ok?"OK":"ERR";
 document.getElementById("mqtt").className=ok?"green":"red";
 document.getElementById("mqttDot").className=ok?"dot on":"dot";
}
function initMQTT(){
 if(isMqttConnected)return;
 setOnline(false);
 try{
  mqttClient.connect({useSSL:true,reconnect:true,timeout:10,keepAliveInterval:30,onSuccess:()=>{
   isMqttConnected=true;mqttClient.subscribe(topicStatus);setOnline(true);pingCar(false)
  },onFailure:()=>{isMqttConnected=false;setOnline(false);setTimeout(initMQTT,5000)}})
 }catch(e){setOnline(false)}
}
mqttClient.onConnectionLost=()=>{isMqttConnected=false;setOnline(false)};
mqttClient.onMessageArrived=msg=>{
 clearTimeout(carTimer);setOnline(true);
 try{
  const d=JSON.parse(msg.payloadString);
  if(d.v!==undefined){const e=document.getElementById("val-battery");e.textContent=Number(d.v).toFixed(2)+"V";e.className=Number(d.v)>12?"green":"red"}
  if(d.e!==undefined){
   isEngineRunning=d.e===1;const e=document.getElementById("val-engine"),i=document.getElementById("icon-engine"),l=document.getElementById("lbl-engine");
   e.textContent=isEngineRunning?"Ndezur":"Fikur";e.className=isEngineRunning?"red":"green";
   i.textContent=isEngineRunning?"🛑":"⚡";i.className=isEngineRunning?"red":"green";l.textContent=isEngineRunning?"STOP":"START";l.className=isEngineRunning?"red":"green";
   document.getElementById("btn-engine").onclick=()=>sendCommand(isEngineRunning?"STOP":"START");
   if(window.setCarPartState)window.setCarPartState("engine",isEngineRunning)
  }
  if(d.l!==undefined){
   const open=d.l===0,e=document.getElementById("val-locks"),i=document.getElementById("icon-locks"),l=document.getElementById("lbl-locks");
   e.textContent=open?"HAPUR":"Mbyllur";e.className=open?"red":"green";
   i.textContent=open?"🔒":"🔓";l.textContent=open?"MBYLL":"SHKYÇ";i.className=l.className=open?"red":"green";
   document.getElementById("btn-locks").onclick=()=>sendCommand(open?"LOCK":"UNLOCK");
   if(window.setCarPartState)window.setCarPartState("doors",open)
  }
  if(d.k!==undefined){
   const e=document.getElementById("val-key"),l=document.getElementById("lbl-key-txt");
   e.textContent=d.k===1?"AKTIV":"JO AKTIV";e.className=d.k===1?"purple":"bgray";l.textContent=d.k===1?"ÇELËSI: AKTIV":"ÇELËSI: JO AKTIV"
  }
  if(d.wh!==undefined&&d.wh>0&&userRole==="admin")updateWorkHours(d.wh);
 }catch(e){}
};
function formatHours(x){if(!x)return"0h 0m";let h=Math.floor(x),m=Math.round((x-h)*60);if(m===60){h++;m=0}return h+"h "+m+"m"}
function updateWorkHours(x){
 db.ref("statistika/ore_pune").transaction(v=>{v=v||{ore_totale:0,lajmerimi_derguar:false};v.ore_totale+=x;return v});
 const n=new Date();db.ref(`workHours/${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()}`).transaction(v=>(v||0)+x)
}
function lexoOretNgaFirebase(){
 db.ref("statistika/ore_pune").on("value",s=>document.getElementById("val-work-hours").textContent=formatHours((s.val()||{}).ore_totale));
 const n=new Date();db.ref(`workHours/${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()}`).on("value",s=>document.getElementById("val-hours-today").textContent=formatHours(s.val()||0))
}
setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleTimeString("sq-AL",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),1000);

window.addEventListener("load",()=>{
 if(sessionStorage.getItem("isAuth"))showApp();else document.getElementById("login").classList.add("active");
 if(sessionStorage.getItem("role")==="admin")lexoOretNgaFirebase();
});

/* ===== 3D: kjo pjese ruan logjikën e versionit tënd për KAPAKUN dhe DYERT ===== */
(function(){
 const MODEL_URL="./2018_hyundai_i30_n.glb";
 let scene,camera,renderer,controls,carModel,sunroofMesh,raycaster,pointer,initialized=false,downPos=null;
 const canvas=document.getElementById("canvas"),viewer=document.getElementById("viewer"),loading=document.getElementById("loading");

 window.setCarPartState=function(part,active){
  if(!carModel)return;
  carModel.traverse(obj=>{
   if(!obj.isMesh)return;
   const n=(obj.name||"").toLowerCase();
   const isEngine=part==="engine"&&(n.includes("hood")||n.includes("bonnet")||n.includes("kapot"));
   const isDoor=part==="doors"&&(n.includes("detach_door_l")||n.includes("detach_door_r")||n.includes("door"));
   if(!isEngine&&!isDoor)return;
   if(!obj.userData.origSaved){obj.userData.origSaved=true;obj.userData.origPos=obj.position.clone();obj.userData.origRot=obj.rotation.clone()}
   if(!obj.userData.isCloned){obj.material=Array.isArray(obj.material)?obj.material.map(m=>m.clone()):obj.material.clone();obj.userData.isCloned=true}
   const mats=Array.isArray(obj.material)?obj.material:[obj.material];
   mats.forEach(m=>{
    if(m._trueOrigEmissive===undefined){m._trueOrigEmissive=m.emissive?m.emissive.clone():new THREE.Color(0);m._trueOrigEI=m.emissiveIntensity??1;m._trueOrigColor=m.color?m.color.clone():new THREE.Color(1,1,1)}
    if(active){if(m.emissive)m.emissive.setHex(0xff0000);m.emissiveIntensity=.8;if(m.color)m.color.setHex(0xff3b30)}
    else{if(m.emissive)m.emissive.copy(m._trueOrigEmissive);m.emissiveIntensity=m._trueOrigEI;if(m.color)m.color.copy(m._trueOrigColor)}
   });
   if(isDoor){
    const right=n.includes("_r")||n.includes("right")||n.includes("_fr")||n.endsWith("_r");
    obj.position.copy(obj.userData.origPos);obj.rotation.copy(obj.userData.origRot);
    if(active){
     const angle=right?.42:-.42,hingeX=right?-.05:.05,hingeZ=1.1,slide=-.25;
     obj.rotation.y+=angle;const c=Math.cos(angle),s=Math.sin(angle);
     const dx=hingeX-(hingeX*c+hingeZ*s),dz=hingeZ-(-hingeX*s+hingeZ*c);
     obj.position.x+=dx;obj.position.z+=dz+slide;
    }
   }
  })
 };

 function flashMesh(mesh,duration=400){
  if(!mesh||!mesh.material)return;
  const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
  mats.forEach(m=>{if(m.emissive){if(!m._old)m._old=m.emissive.clone();m.emissive.setHex(0x00d2ff);m.emissiveIntensity=.8}});
  setTimeout(()=>mats.forEach(m=>{if(m.emissive&&m._old)m.emissive.copy(m._old)}),duration)
 }
 function partName(obj){
  let s="";while(obj&&obj!==scene){s+=" "+(obj.name||"").toLowerCase();obj=obj.parent}
  if(s.includes("upper")||s.includes("roof")||s.includes("sunroof")||s.includes("panoram")||s.includes("tavan"))return"sunroof";
  if(s.includes("door")||s.includes("dyr")||s.includes("porta")||s.includes("detach_door"))return"door";
  if(s.includes("hood")||s.includes("bonnet")||s.includes("kapot"))return"engine";
  if((s.includes("glass")||s.includes("window")||s.includes("dritare"))&&!s.includes("roof"))return"windows";
  return null
 }
 function trigger(part,mesh){
  if(part==="door"){
   flashMesh(mesh);const t=document.getElementById("val-locks").innerText;
   if(t.indexOf("Mbyllur")===0||t==="--"){sendCommand("UNLOCK");showFeedback("🔓 Duke shkyçur dyert")}
   else{sendCommand("LOCK");showFeedback("🔒 Duke mbyllur dyert")}
  }else if(part==="engine"){
   flashMesh(mesh);if(isEngineRunning){sendCommand("STOP");setTimeout(()=>sendCommand("LOCK"),500);showFeedback("🛑 Motorri u fik & Dyert u kyçën!")}
   else{sendCommand("TRIP_MODE");showFeedback("🚀 Trip Mode u aktivizua!")}
  }else if(part==="sunroof"){if(userRole==="guest"){showFeedback("⛔ Nuk keni akses për tavanin");return}flashMesh(mesh,8000);sendCommand("SUNROOF");showFeedback("🪟 Duke lëvizur tavanin...")}
  else if(part==="windows"){showFeedback("ℹ️ Përdor butonin XHAMAT në ekran")}
 }
 function tap(e){
  if(!carModel)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(carModel,true);if(!hits.length)return;
  const hit=hits[0];if(hit.object===sunroofMesh)return trigger("sunroof",hit.object);
  const p=partName(hit.object);if(p)trigger(p,hit.object);else showFeedback("🤔 Pjesë e panjohur")
 }
 function resize(){if(!renderer)return;const w=Math.max(viewer.clientWidth,100),h=Math.max(viewer.clientHeight,100);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
 function init(){
  if(initialized)return;initialized=true;
  const w=Math.max(viewer.clientWidth,100),h=Math.max(viewer.clientHeight,100);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,w/h,.1,1000);camera.position.set(-5,4.5,6);
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(w,h,false);renderer.outputEncoding=THREE.sRGBEncoding;
  scene.add(new THREE.AmbientLight(0xffffff,.7));const d=new THREE.DirectionalLight(0xffffff,.8);d.position.set(6,12,8);scene.add(d);const d2=new THREE.DirectionalLight(0x88ccff,.5);d2.position.set(-6,6,-6);scene.add(d2);
  controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.1;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=14;controls.maxPolarAngle=Math.PI/2.05;
  raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();
  new THREE.GLTFLoader().load(MODEL_URL,g=>{
   carModel=g.scene;
   const pearl=new THREE.Color(0xF2F4F5);
   carModel.traverse(o=>{if(!o.isMesh||!o.material)return;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{const n=String(m.name||"").toLowerCase();if(n==="carpaint"||n.includes("carpaint")){m.color.copy(pearl);if("metalness"in m)m.metalness=.45;if("roughness"in m)m.roughness=.24}})});
   const box=new THREE.Box3().setFromObject(carModel),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1,scale=7.9/max;
   carModel.scale.setScalar(scale);carModel.position.x=-center.x*scale;carModel.position.z=-center.z*scale;carModel.position.y=-box.min.y*scale;scene.add(carModel);
   const sg=new THREE.PlaneGeometry(size.x*.28,size.z*.20),sm=new THREE.MeshStandardMaterial({color:0x050505,roughness:.1,metalness:.8,side:THREE.DoubleSide});
   sunroofMesh=new THREE.Mesh(sg,sm);sunroofMesh.rotation.x=-Math.PI/2;sunroofMesh.position.set(center.x,box.max.y,center.z-size.z*.12);carModel.add(sunroofMesh);
   controls.target.set(0,(size.y*scale)/2,0);controls.update();loading.style.display="none";
   setCarPartState("engine",isEngineRunning);setCarPartState("doors",document.getElementById("val-locks").innerText==="HAPUR")
  },undefined,e=>{loading.textContent="⚠️ Modeli 3D nuk u ngarkua";console.error(e)});
  canvas.addEventListener("pointerdown",e=>downPos={x:e.clientX,y:e.clientY});
  canvas.addEventListener("pointerup",e=>{if(!downPos)return;const dx=e.clientX-downPos.x,dy=e.clientY-downPos.y;downPos=null;if(Math.hypot(dx,dy)<8)tap(e)});
  window.addEventListener("resize",resize);
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
 }
 init();
})();
