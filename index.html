<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulti 3D - Makina</title>
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #car3d-wrap {
            position: relative;
            width: 100%;
            height: 320px;
            background: radial-gradient(circle, #222 0%, #111 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }

        #car3d {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #car3d-status {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border: 1px solid #00d2ff;
            white-space: nowrap;
        }

        /* Paneli i Butonave UI */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .control-btn {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn:active {
            transform: scale(0.97);
        }

        .control-btn:hover {
            background: #2a2a2a;
            border-color: #00d2ff;
            color: #00d2ff;
        }

        .control-btn.active {
            background: #00d2ff;
            color: #121212;
            border-color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Skena 3D -->
        <div id="car3d-wrap">
            <canvas id="car3d"></canvas>
            <div id="car3d-status">Gati</div>
        </div>

        <!-- Butonat e Pultit në Ekran -->
        <div class="control-grid">
            <button class="control-btn" onclick="handleCommand('UNLOCK')">🔓 Hape / Mbyll</button>
            <button class="control-btn" onclick="handleCommand('START')">🔥 Motorri (Start)</button>
            <button class="control-btn" onclick="handleCommand('WINDOWS')">🪟 Xhamat</button>
            <button class="control-btn" onclick="handleCommand('SUNROOF')">☀️ Tavani</button>
        </div>
    </div>

    <script>
        // Emri i skedarit 3D në GitHub (në të njëjtën dosje)
        const MODEL_FILE = '2018_hyundai_i30_n.glb'; 

        let carScene, carCamera, carRenderer, carControls;
        let carModel = null;
        const car3dStatus = document.getElementById('car3d-status');

        function showStatus(text) {
            if (!car3dStatus) return;
            car3dStatus.innerText = text;
            car3dStatus.style.opacity = '1';
            setTimeout(() => { car3dStatus.style.opacity = '0'; }, 2500);
        }

        // Menaxhimi i komandave nga butonat e ekranit
        function handleCommand(cmd) {
            console.log("Komanda e dërguar:", cmd);
            
            switch(cmd) {
                case 'UNLOCK':
                    showStatus("🚪 Dyert u ndryshuan (Lock/Unlock)");
                    break;
                case 'START':
                    showStatus("🔥 Motorri u ndez / u fik");
                    break;
                case 'WINDOWS':
                    showStatus("🪟 Xhamat u aktivizuan");
                    break;
                case 'SUNROOF':
                    showStatus("☀️ Tavani panoramik u kontrollua");
                    break;
                default:
                    showStatus("🚘 Komanda u ekzekutua");
            }

            // Këtu mund të shtoni thirrjen tuaj për backend/websocket/API nëse është e nevojshme
        }

        // Inicializimi i Skenës 3D
        function initCar3D() {
            const canvas = document.getElementById('car3d');
            if (!canvas) return;

            carScene = new THREE.Scene();
            
            carCamera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
            carCamera.position.set(4, 2, 4);

            carRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            carRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
            carRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            if (typeof THREE.OrbitControls !== 'undefined') {
                carControls = new THREE.OrbitControls(carCamera, carRenderer.domElement);
                carControls.enableDamping = true;
                carControls.dampingFactor = 0.05;
                carControls.maxPolarAngle = Math.PI / 2 - 0.05;
            }

            // Ndriçimi
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            carScene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00d2ff, 2.0);
            dirLight.position.set(5, 10, 7);
            carScene.add(dirLight);

            const pointLight = new THREE.DirectionalLight(0xffffff, 1.0);
            pointLight.position.set(-5, -5, -5);
            carScene.add(pointLight);

            // Ngarkimi i Modelit 3D nga GitHub (e njëjta dosje)
            const loader = new THREE.GLTFLoader();
            loader.load(MODEL_FILE, (gltf) => {
                carModel = gltf.scene;
                carModel.scale.set(1, 1, 1);
                carModel.position.set(0, -0.5, 0);
                carScene.add(carModel);
                showStatus("Modeli 3D u ngarkua");
            }, undefined, (error) => {
                console.error("Gabim në ngarkimin e modelit 3D:", error);
                showStatus("Gabim në ngarkimin e modelit");
            });

            // Unaza e Renderimit
            function animate() {
                requestAnimationFrame(animate);
                if (carControls) carControls.update();
                if (carRenderer && carScene && carCamera) {
                    carRenderer.render(carScene, carCamera);
                }
            }
            animate();

            // Përshtatja e madhësisë në ndryshim dritareje
            window.addEventListener('resize', () => {
                if (!canvas || !carRenderer || !carCamera) return;
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                carCamera.aspect = width / height;
                carCamera.updateProjectionMatrix();
                carRenderer.setSize(width, height);
            });
        }

        window.addEventListener('load', () => {
            initCar3D();
        });
    </script>
</body>
</html>
